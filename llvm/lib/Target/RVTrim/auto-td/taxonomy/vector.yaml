# Operand/effect categories for the standard 'V' vector extension.
#
# A category fixes shape only: which operand class fills which database field,
# in which order.  Encodings still come exclusively from
# third_party/riscv-opcodes; nothing here can influence a bit position.
#
# The `lets` block carries properties that are neither operands nor booleans:
# `DestEEW`, `VS1VS2Constraint`, `ElementsDependOn` and `Constraints` all end
# up in TSFlags or in the register allocator, so they must survive a migration
# from hand-written records unchanged.

categories:

  # --- vsetvli / vsetivli / vsetvl ----------------------------------------
  # All three write VL and VTYPE and are modelled as having side effects.
  vset_vli:
    operands:
      outs: [{role: dest, field: rd, reg_class: GPR}]
      ins:
        - {role: avl, field: rs1, reg_class: GPR}
        - {role: vtype, field: zimm11, var: vtypei, operand: VTypeIOp11}
    effects: {has_side_effects: true, implicit_defs: [VL, VTYPE]}

  vset_ivli:
    operands:
      outs: [{role: dest, field: rd, reg_class: GPR}]
      ins:
        - {role: uimm, field: zimm5, var: uimm, operand: uimm5}
        - {role: vtype, field: zimm10, var: vtypei, operand: VTypeIOp10}
    effects: {has_side_effects: true, implicit_defs: [VL, VTYPE]}

  vset_vl:
    operands:
      outs: [{role: dest, field: rd, reg_class: GPR}]
      ins:
        - {role: avl, field: rs1, reg_class: GPR}
        - {role: vlmax, field: rs2, reg_class: GPR}
    effects: {has_side_effects: true, implicit_defs: [VL, VTYPE]}

  # --- integer ALU, register-register / register-immediate ----------------
  v_vv:
    operands:
      outs: [{role: dest, field: vd, reg_class: VR}]
      ins:
        - {role: lhs, field: vs2, reg_class: VR}
        - {role: rhs, field: vs1, reg_class: VR}
        - {role: mask, field: vm, operand: VMaskOp}
    effects:
      implicit_uses: [VL, VTYPE]
      flags: [UseNamedOperandTable, VMConstraint]
      lets: {ElementsDependOn: EltDepsNone}

  v_vx:
    operands:
      outs: [{role: dest, field: vd, reg_class: VR}]
      ins:
        - {role: lhs, field: vs2, reg_class: VR}
        - {role: rhs, field: rs1, reg_class: GPR}
        - {role: mask, field: vm, operand: VMaskOp}
    effects:
      implicit_uses: [VL, VTYPE]
      flags: [UseNamedOperandTable, VMConstraint]
      lets: {ElementsDependOn: EltDepsNone}

  v_vi:
    operands:
      outs: [{role: dest, field: vd, reg_class: VR}]
      ins:
        - {role: lhs, field: vs2, reg_class: VR}
        - {role: rhs, field: simm5, var: imm, operand: simm5}
        - {role: mask, field: vm, operand: VMaskOp}
    effects:
      implicit_uses: [VL, VTYPE]
      flags: [UseNamedOperandTable, VMConstraint]
      lets: {ElementsDependOn: EltDepsNone}

  v_vadc_vim:
    operands:
      outs:
        - {role: dest, field: vd, reg_class: VR}
      ins:
        - {role: lhs, field: vs2, reg_class: VR}
        - {role: rhs, field: simm5, var: imm, operand: simm5}
        - {role: mask, field: vm, operand: VMaskCarryInOp}
    effects: {implicit_uses: [VL, VTYPE], flags: [UseNamedOperandTable, VMConstraint], lets: {ElementsDependOn: EltDepsNone}}
    # members: vadc.vim

  v_vadc_vvm:
    operands:
      outs:
        - {role: dest, field: vd, reg_class: VR}
      ins:
        - {role: lhs, field: vs2, reg_class: VR}
        - {role: rhs, field: vs1, reg_class: VR}
        - {role: mask, field: vm, operand: VMaskCarryInOp}
    effects: {implicit_uses: [VL, VTYPE], flags: [UseNamedOperandTable, VMConstraint], lets: {ElementsDependOn: EltDepsNone}}
    # members: vadc.vvm

  v_vadc_vxm:
    operands:
      outs:
        - {role: dest, field: vd, reg_class: VR}
      ins:
        - {role: lhs, field: vs2, reg_class: VR}
        - {role: rhs, field: rs1, reg_class: GPR}
        - {role: mask, field: vm, operand: VMaskCarryInOp}
    effects: {implicit_uses: [VL, VTYPE], flags: [UseNamedOperandTable, VMConstraint], lets: {ElementsDependOn: EltDepsNone}}
    # members: vadc.vxm

  v_unary:
    operands:
      outs:
        - {role: dest, field: vd, reg_class: VR}
      ins:
        - {role: lhs, field: vs2, reg_class: VR}
        - {role: mask, field: vm, operand: VMaskOp}
    effects: {implicit_uses: [VL, VTYPE], flags: [UseNamedOperandTable, VMConstraint], lets: {ElementsDependOn: EltDepsNone}}
    # members: vsext.vf2, vsext.vf4, vsext.vf8, vzext.vf2, vzext.vf4, vzext.vf8

  v_vwaddu_vv:
    operands:
      outs:
        - {role: dest, field: vd, reg_class: VR}
      ins:
        - {role: lhs, field: vs2, reg_class: VR}
        - {role: rhs, field: vs1, reg_class: VR}
        - {role: mask, field: vm, operand: VMaskOp}
    effects: {implicit_uses: [VL, VTYPE], flags: [UseNamedOperandTable, VMConstraint], lets: {Constraints: '"@earlyclobber $vd"', DestEEW: EEWSEWx2, VS1VS2Constraint: WidenV, ElementsDependOn: EltDepsNone}}
    # members: vwaddu.vv, vwadd.vv, vwsubu.vv, vwsub.vv

  v_vwaddu_vx:
    operands:
      outs:
        - {role: dest, field: vd, reg_class: VR}
      ins:
        - {role: lhs, field: vs2, reg_class: VR}
        - {role: rhs, field: rs1, reg_class: GPR}
        - {role: mask, field: vm, operand: VMaskOp}
    effects: {implicit_uses: [VL, VTYPE], flags: [UseNamedOperandTable, VMConstraint], lets: {Constraints: '"@earlyclobber $vd"', DestEEW: EEWSEWx2, VS1VS2Constraint: WidenV, ElementsDependOn: EltDepsNone}}
    # members: vwaddu.vx, vwadd.vx, vwsubu.vx, vwsub.vx

  v_vwaddu_wv:
    operands:
      outs:
        - {role: dest, field: vd, reg_class: VR}
      ins:
        - {role: lhs, field: vs2, reg_class: VR}
        - {role: rhs, field: vs1, reg_class: VR}
        - {role: mask, field: vm, operand: VMaskOp}
    effects: {implicit_uses: [VL, VTYPE], flags: [UseNamedOperandTable, VMConstraint], lets: {Constraints: '"@earlyclobber $vd"', DestEEW: EEWSEWx2, VS1VS2Constraint: WidenW, ElementsDependOn: EltDepsNone}}
    # members: vwaddu.wv, vwadd.wv, vwsubu.wv, vwsub.wv

  v_vwaddu_wx:
    operands:
      outs:
        - {role: dest, field: vd, reg_class: VR}
      ins:
        - {role: lhs, field: vs2, reg_class: VR}
        - {role: rhs, field: rs1, reg_class: GPR}
        - {role: mask, field: vm, operand: VMaskOp}
    effects: {implicit_uses: [VL, VTYPE], flags: [UseNamedOperandTable, VMConstraint], lets: {Constraints: '"@earlyclobber $vd"', DestEEW: EEWSEWx2, VS1VS2Constraint: WidenW, ElementsDependOn: EltDepsNone}}
    # members: vwaddu.wx, vwadd.wx, vwsubu.wx, vwsub.wx
